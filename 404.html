<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sivaganga: The Queen's Gambit</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License - https://github.com/rafgraph/spa-github-pages
    // Converts the path and query into a query string for index.html to restore
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p style="font-family: serif; text-align: center; margin-top: 20%; color: #d4af37;">
    Passing through the Fort Gates... Redirecting to Sivaganga: The Queen's Gambit...
  </p>
</body>
</html>
